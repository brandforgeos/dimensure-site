<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 480 264" role="img" aria-labelledby="t d"><title id="t">After the audit: gully at the upstream face of the build-out</title><desc id="d">Plan view. The road channel falls towards a kerb build-out. A gully now sits in the corner against the build-out's upstream face, so water reaching the build-out drains away.</desc><style>text{font-family:Archivo,Helvetica,Arial,sans-serif;fill:#0B222C}.sm{font-size:15px}.lb{font-size:17px;font-weight:600}.mu{fill:#3E5560}</style><rect x="0" y="34" width="480" height="58" fill="#E3E9E6"/><text x="16" y="68" class="sm mu">Footway</text><rect x="0" y="92" width="480" height="206" fill="#C3CCC8"/><text x="16" y="284" class="sm mu">Carriageway</text><rect x="0" y="92" width="480" height="20" fill="#B2BCB8"/><path d="M262 92 L296 168 L392 168 L426 92 Z" fill="#E3E9E6" stroke="#0B222C" stroke-width="3" stroke-linejoin="round"/><line x1="0" y1="92" x2="262" y2="92" stroke="#0B222C" stroke-width="3"/><line x1="426" y1="92" x2="480" y2="92" stroke="#0B222C" stroke-width="3"/><text x="344" y="138" text-anchor="middle" class="sm">Build-out</text><path d="M24 102 h46" stroke="#1F6E5A" stroke-width="3" fill="none"/><path d="M70 96 l10 6 l-10 6 z" fill="#1F6E5A"/><path d="M104 102 h46" stroke="#1F6E5A" stroke-width="3" fill="none"/><path d="M150 96 l10 6 l-10 6 z" fill="#1F6E5A"/><path d="M184 102 h46" stroke="#1F6E5A" stroke-width="3" fill="none"/><path d="M230 96 l10 6 l-10 6 z" fill="#1F6E5A"/><text x="24" y="138" class="lb" style="fill:#1F6E5A">Channel falls</text><rect x="228" y="94" width="30" height="18" rx="2" fill="#0B222C"/><line x1="233" y1="97" x2="233" y2="109" stroke="#C3CCC8" stroke-width="1.6"/><line x1="238" y1="97" x2="238" y2="109" stroke="#C3CCC8" stroke-width="1.6"/><line x1="243" y1="97" x2="243" y2="109" stroke="#C3CCC8" stroke-width="1.6"/><line x1="248" y1="97" x2="248" y2="109" stroke="#C3CCC8" stroke-width="1.6"/><line x1="253" y1="97" x2="253" y2="109" stroke="#C3C