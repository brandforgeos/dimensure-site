<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 480 264" role="img" aria-labelledby="t d"><title id="t">As drawn: kerb build-out across a falling channel with no gully on its uphill side</title><desc id="d">Plan view. The road channel falls towards a kerb build-out. The only gully is past the build-out on its downhill side, so water running along the channel is held against the build-out's upstream face.</desc><style>text{font-family:Archivo,Helvetica,Arial,sans-serif;fill:#0B222C}.sm{font-size:15px}.lb{font-size:17px;font-weight:600}.mu{fill:#3E5560}</style><rect x="0" y="34" width="480" height="58" fill="#E3E9E6"/><text x="16" y="68" class="sm mu">Footway</text><rect x="0" y="92" width="480" height="206" fill="#C3CCC8"/><text x="16" y="284" class="sm mu">Carriageway</text><rect x="0" y="92" width="480" height="20" fill="#B2BCB8"/><path d="M262 92 L296 168 L392 168 L426 92 Z" fill="#E3E9E6" stroke="#0B222C" stroke-width="3" stroke-linejoin="round"/><line x1="0" y1="92" x2="262" y2="92" stroke="#0B222C" stroke-width="3"/><line x1="426" y1="92" x2="480" y2="92" stroke="#0B222C" stroke-width="3"/><text x="344" y="138" text-anchor="middle" class="sm">Build-out</text><path d="M24 102 h46" stroke="#1F6E5A" stroke-width="3" fill="none"/><path d="M70 96 l10 6 l-10 6 z" fill="#1F6E5A"/><path d="M104 102 h46" stroke="#1F6E5A" stroke-width="3" fill="none"/><path d="M150 96 l10 6 l-10 6 z" fill="#1F6E5A"/><text x="24" y="138" class="lb" style="fill:#1F6E5A">Channel falls</text><ellipse cx="238" cy="104" rx="40" ry="15" fill="#6FB7FF" fill-opacity=".75"/><circle cx="240" cy="104" r="34" fill="none" stroke="#C8462B" stroke-width="3.5"/><text x="196" y="200" class="lb" style="fill:#C8462B">Water held here</text><path d="M232 178 L236 142" stroke="#C8462B" stroke-width="2.5"/><rect x="440" y="94" width="30" height="18" rx="2" fill="#0B222C"/><line x1="445" y1="97" x2="445" y2="109" stroke="#C3CCC8" stroke-width="1.6"/><line x1="450" y1="97" x2="450" y2="109" stroke="#C3CCC8" stroke-width="1.6"/><line x1="455" y1="97" x2="455" y2="109" stroke="#C3CCC8" stroke-width="1.6"/><line x1="460" y1="97" x2="460" y2="109" stroke="#C3CCC8" stroke-width="1.6"/><line x1="465" y1="97" x2="465" y2="109" stroke="#C3CCC8" stroke-width="1.6"/><text x="464" y="200" text-anchor="end" class="sm">Only gully: on the</text><text x="464" y="219" text-anchor="end" class="sm">downhill side</text><path d="M455 182 L455 116" stroke="#0B222C" stroke-width="2" stroke-dasharray="4 4"/></svg>